<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BG Remover</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F6F3; --surface: #FFFFFF; --border: #E8E6E0;
      --text: #1A1917; --muted: #8C8A85; --accent: #1A1917;
      --green: #2D6A4F; --green-light: #D8F3DC;
      --amber: #B45309; --amber-light: #FEF3C7;
      --radius: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 28px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface); }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; letter-spacing: -0.3px; }
    .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: grid; place-items: center; }
    .logo-icon svg { width: 18px; height: 18px; }
    .badge { font-family: 'DM Mono', monospace; font-size: 11px; background: var(--bg); border: 1px solid var(--border); padding: 3px 8px; border-radius: 20px; color: var(--muted); }
    main { flex: 1; max-width: 960px; width: 100%; margin: 0 auto; padding: 48px 24px; }
    .drop-zone { border: 2px dashed var(--border); border-radius: 20px; padding: 64px 40px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--surface); position: relative; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: #FAFAF8; }
    .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .drop-icon { width: 56px; height: 56px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; display: grid; place-items: center; margin: 0 auto 20px; }
    .drop-icon svg { width: 26px; height: 26px; color: var(--muted); }
    .drop-title { font-size: 18px; font-weight: 500; letter-spacing: -0.3px; margin-bottom: 8px; }
    .drop-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }
    .drop-sub span { display: inline-block; margin-top: 6px; font-family: 'DM Mono', monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin: 32px 0 16px; padding: 0 2px; }
    .toolbar-left { display: flex; align-items: center; gap: 12px; }
    .count-label { font-size: 14px; font-weight: 500; }
    .count-label span { color: var(--muted); font-weight: 400; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
    .btn svg { width: 15px; height: 15px; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #333; }
    .btn-primary:disabled { background: #CCC; cursor: not-allowed; }
    .btn-outline { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--bg); }
    .btn-outline:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); padding: 8px 10px; }
    .btn-ghost:hover { color: var(--text); background: var(--bg); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: box-shadow 0.2s; position: relative; }
    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .card-img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: repeating-conic-gradient(#F0EEE9 0% 25%, #E8E6E0 0% 50%) 0 0 / 16px 16px; }
    .card-body { padding: 10px 12px; border-top: 1px solid var(--border); }
    .card-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
    .card-status { display: flex; align-items: center; justify-content: space-between; }
    .status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; }
    .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-waiting { background: var(--bg); color: var(--muted); }
    .status-waiting .dot { background: var(--muted); }
    .status-processing { background: var(--amber-light); color: var(--amber); }
    .status-processing .dot { background: var(--amber); animation: pulse 1s infinite; }
    .status-done { background: var(--green-light); color: var(--green); }
    .status-done .dot { background: var(--green); }
    .status-error { background: #FEE2E2; color: #B91C1C; }
    .status-error .dot { background: #B91C1C; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .btn-download { background: none; border: none; padding: 4px; cursor: pointer; color: var(--muted); border-radius: 6px; display: grid; place-items: center; transition: all 0.15s; }
    .btn-download:hover { color: var(--text); background: var(--bg); }
    .btn-download svg { width: 15px; height: 15px; }
    .btn-download:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-remove { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.9); border: 1px solid var(--border); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; display: none; place-items: center; color: var(--muted); font-size: 16px; line-height: 1; transition: all 0.15s; }
    .card:hover .btn-remove { display: grid; }
    .btn-remove:hover { color: #B91C1C; border-color: #FCA5A5; background: #FEF2F2; }
    .progress-wrap { margin: 24px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; display: none; }
    .progress-wrap.visible { display: block; }
    .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .progress-label { font-size: 13px; font-weight: 500; }
    .progress-count { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
    .progress-bar-track { height: 4px; background: var(--bg); border-radius: 99px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; width: 0%; }
    footer { text-align: center; padding: 24px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
    .notif { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: white; padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.15); transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 100; }
    .notif.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
      </svg>
    </div>
    BG Remover
  </div>
  <div class="badge">100% Local · No Upload</div>
</header>

<main>
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="image/*" multiple />
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <div class="drop-title">Drag & drop foto di sini</div>
    <div class="drop-sub">atau klik untuk memilih file<br><span>JPG · PNG · WEBP</span></div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-top">
      <span class="progress-label" id="progressLabel">Memproses...</span>
      <span class="progress-count" id="progressCount">0 / 0</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none">
    <div class="toolbar-left">
      <span class="count-label" id="countLabel">0 foto <span>dipilih</span></span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-ghost" onclick="clearAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        Hapus Semua
      </button>
      <button class="btn btn-outline" id="btnDownloadAll" onclick="downloadAll()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Semua
      </button>
      <button class="btn btn-primary" id="btnProcess" onclick="startProcessing()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Proses Semua
      </button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>Semua pemrosesan dilakukan di browser Anda. Foto tidak dikirim ke server manapun.</footer>
<div class="notif" id="notif"></div>

<script type="module">
  import { removeBackground as removeBgLib } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/browser/index.mjs';

  const PUBLIC_PATH = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/browser/';

  const state = { files: [], results: {}, processing: false };

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const grid = document.getElementById('grid');
  const toolbar = document.getElementById('toolbar');
  const btnProcess = document.getElementById('btnProcess');
  const btnDownloadAll = document.getElementById('btnDownloadAll');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressCount = document.getElementById('progressCount');
  const progressLabel = document.getElementById('progressLabel');
  const countLabel = document.getElementById('countLabel');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    addFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
  });
  fileInput.addEventListener('change', e => { addFiles(Array.from(e.target.files)); fileInput.value = ''; });

  function addFiles(newFiles) {
    newFiles.forEach(file => {
      const id = Date.now() + Math.random().toString(36).slice(2);
      state.files.push({ id, file, status: 'waiting' });
      renderCard({ id, file });
    });
    updateUI();
  }

  function renderCard(item) {
    const url = URL.createObjectURL(item.file);
    const card = document.createElement('div');
    card.className = 'card'; card.id = 'card-' + item.id;
    card.innerHTML = `
      <button class="btn-remove" onclick="window._removeCard('${item.id}')">×</button>
      <img class="card-img" id="img-${item.id}" src="${url}" />
      <div class="card-body">
        <div class="card-name" title="${item.file.name}">${item.file.name}</div>
        <div class="card-status">
          <span class="status-badge status-waiting" id="status-${item.id}"><span class="dot"></span> Menunggu</span>
          <button class="btn-download" id="dl-${item.id}" disabled title="Download" onclick="window._downloadSingle('${item.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
        </div>
      </div>`;
    grid.appendChild(card);
  }

  window._removeCard = function(id) {
    state.files = state.files.filter(f => f.id !== id);
    delete state.results[id];
    const card = document.getElementById('card-' + id);
    if (card) card.remove();
    updateUI();
  };

  window.clearAll = function() {
    state.files = []; state.results = {}; grid.innerHTML = ''; updateUI();
  };

  function updateUI() {
    const count = state.files.length;
    toolbar.style.display = count > 0 ? 'flex' : 'none';
    countLabel.innerHTML = `${count} foto <span>ditambahkan</span>`;
    const doneCount = Object.values(state.results).filter(Boolean).length;
    btnDownloadAll.disabled = doneCount === 0;
    btnProcess.disabled = state.processing || count === 0;
  }

  function setStatus(id, status) {
    const badge = document.getElementById('status-' + id);
    if (!badge) return;
    const labels = { waiting: 'Menunggu', processing: 'Memproses...', done: 'Selesai', error: 'Gagal' };
    badge.className = `status-badge status-${status}`;
    badge.innerHTML = `<span class="dot"></span> ${labels[status]}`;
  }

  window.startProcessing = async function() {
    if (state.processing) return;
    state.processing = true;
    btnProcess.disabled = true;
    progressWrap.classList.add('visible');

    const queue = state.files.filter(f => !state.results[f.id]);
    let done = 0;

    for (const item of queue) {
      progressLabel.textContent = `Memproses: ${item.file.name}`;
      progressCount.textContent = `${done} / ${queue.length}`;
      progressFill.style.width = `${(done / queue.length) * 100}%`;
      setStatus(item.id, 'processing');

      try {
        const blob = await removeBgLib(item.file, {
          publicPath: PUBLIC_PATH,
          output: { format: 'image/png', quality: 1 },
          progress: (key, current, total) => {
            if (key === 'compute:inference' && total > 0) {
              const pct = Math.round((current / total) * 100);
              progressLabel.textContent = `Memproses ${item.file.name} (${pct}%)`;
            } else if (key.startsWith('fetch') && total > 0) {
              const pct = Math.round((current / total) * 100);
              progressLabel.textContent = `Memuat model AI... ${pct}%`;
            }
          }
        });
        state.results[item.id] = blob;
        document.getElementById('img-' + item.id).src = URL.createObjectURL(blob);
        setStatus(item.id, 'done');
        document.getElementById('dl-' + item.id).disabled = false;
      } catch (err) {
        console.error('Error processing', item.file.name, err);
        setStatus(item.id, 'error');
      }
      done++;
    }

    progressCount.textContent = `${done} / ${queue.length}`;
    progressFill.style.width = '100%';
    progressLabel.textContent = `Selesai! ${done} foto diproses.`;
    state.processing = false;
    updateUI();
    showNotif(`${done} foto berhasil diproses`);
  };

  window._downloadSingle = function(id) {
    const blob = state.results[id];
    if (!blob) return;
    const item = state.files.find(f => f.id === id);
    const name = item ? item.file.name.replace(/\.[^.]+$/, '') + '_no_bg.png' : 'result.png';
    triggerDownload(blob, name);
  };

  window.downloadAll = async function() {
    const done = state.files.filter(f => state.results[f.id]);
    if (!done.length) return;
    if (done.length === 1) { window._downloadSingle(done[0].id); return; }
    showNotif('Membuat ZIP...');
    const zip = new JSZip();
    done.forEach(item => {
      zip.file(item.file.name.replace(/\.[^.]+$/, '') + '_no_bg.png', state.results[item.id]);
    });
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    triggerDownload(zipBlob, 'bg_removed.zip');
    showNotif('ZIP berhasil diunduh!');
  };

  function triggerDownload(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename; a.click();
  }

  function showNotif(msg) {
    const notif = document.getElementById('notif');
    notif.textContent = msg; notif.classList.add('show');
    setTimeout(() => notif.classList.remove('show'), 2800);
  }
</script>
</body>
</html>
