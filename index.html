<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BG Remover</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#F7F6F3;--surface:#fff;--border:#E8E6E0;--text:#1A1917;--muted:#8C8A85;--accent:#1A1917;--green:#2D6A4F;--gl:#D8F3DC;--amber:#B45309;--al:#FEF3C7;--r:12px}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    header{padding:24px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface)}
    .logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.3px}
    .logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:grid;place-items:center}
    .logo-icon svg{width:18px;height:18px}
    .badge{font-family:'DM Mono',monospace;font-size:11px;background:var(--bg);border:1px solid var(--border);padding:3px 8px;border-radius:20px;color:var(--muted)}
    main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:40px 24px}
    .banner{border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:18px;display:none;align-items:center;gap:8px;line-height:1.5}
    .banner.on{display:flex}
    .bwarn{background:var(--al);border:1px solid #FDE68A;color:var(--amber)}
    .berr{background:#FEE2E2;border:1px solid #FCA5A5;color:#B91C1C}
    .drop-zone{border:2px dashed var(--border);border-radius:20px;padding:56px 40px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface);position:relative}
    .drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:#FAFAF8}
    .drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
    .di{width:52px;height:52px;background:var(--bg);border:1px solid var(--border);border-radius:14px;display:grid;place-items:center;margin:0 auto 16px}
    .di svg{width:24px;height:24px;color:var(--muted)}
    .dt{font-size:17px;font-weight:500;margin-bottom:6px}
    .ds{font-size:13px;color:var(--muted)}
    .ds code{display:inline-block;margin-top:6px;font-family:'DM Mono',monospace;font-size:11px;background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:4px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}
    .cl{font-size:14px;font-weight:500}.cl span{color:var(--muted);font-weight:400}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
    .btn svg{width:14px;height:14px}
    .bprimary{background:var(--accent);color:#fff}.bprimary:hover:not(:disabled){background:#333}.bprimary:disabled{background:#ccc;cursor:not-allowed}
    .boutline{background:var(--surface);color:var(--text);border:1px solid var(--border)}.boutline:hover:not(:disabled){background:var(--bg)}.boutline:disabled{opacity:.4;cursor:not-allowed}
    .bghost{background:transparent;color:var(--muted);padding:8px 10px}.bghost:hover{color:var(--text);background:var(--bg)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:box-shadow .2s;position:relative}
    .card:hover{box-shadow:0 4px 20px rgba(0,0,0,.07)}
    .cimg{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:repeating-conic-gradient(#F0EEE9 0% 25%,#E8E6E0 0% 50%) 0 0/14px 14px}
    .cbody{padding:10px 12px;border-top:1px solid var(--border)}
    .cname{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;color:var(--muted)}
    .cst{display:flex;align-items:center;justify-content:space-between}
    .sb{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px}
    .sb .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .sw{background:var(--bg);color:var(--muted)}.sw .dot{background:var(--muted)}
    .sp{background:var(--al);color:var(--amber)}.sp .dot{background:var(--amber);animation:blink 1s infinite}
    .sd{background:var(--gl);color:var(--green)}.sd .dot{background:var(--green)}
    .se{background:#FEE2E2;color:#B91C1C}.se .dot{background:#B91C1C}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .bdl{background:none;border:none;padding:4px;cursor:pointer;color:var(--muted);border-radius:6px;display:grid;place-items:center;transition:all .15s}
    .bdl:hover:not(:disabled){color:var(--text);background:var(--bg)}.bdl svg{width:14px;height:14px}.bdl:disabled{opacity:.25;cursor:not-allowed}
    .bx{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:6px;width:24px;height:24px;cursor:pointer;display:none;place-items:center;font-size:15px;color:var(--muted);transition:all .15s}
    .card:hover .bx{display:grid}.bx:hover{color:#B91C1C;background:#FEF2F2;border-color:#FCA5A5}
    .pw{margin:20px 0 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;display:none}
    .pw.on{display:block}
    .pt{display:flex;justify-content:space-between;margin-bottom:8px}
    .plbl{font-size:13px;font-weight:500}.pct{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
    .ptrack{height:3px;background:var(--bg);border-radius:99px;overflow:hidden}
    .pfill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s;width:0}
    footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
    .notif{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.15);transform:translateY(70px);opacity:0;transition:all .3s;z-index:999}
    .notif.on{transform:translateY(0);opacity:1}
  </style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    </div>
    BG Remover
  </div>
  <div class="badge">100% Local · No Upload</div>
</header>
<main>
  <div class="banner bwarn" id="banner">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="btxt"></span>
  </div>
  <div class="drop-zone" id="dz">
    <input type="file" id="fi" accept="image/*" multiple />
    <div class="di"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
    <div class="dt">Drag & drop foto di sini</div>
    <div class="ds">atau klik untuk pilih file<br><code>JPG · PNG · WEBP</code></div>
  </div>
  <div class="pw" id="pw">
    <div class="pt"><span class="plbl" id="plbl">Memproses...</span><span class="pct" id="pct">0/0</span></div>
    <div class="ptrack"><div class="pfill" id="pfill"></div></div>
  </div>
  <div class="toolbar" id="tb" style="display:none">
    <span class="cl" id="cl">0 foto <span>ditambahkan</span></span>
    <div style="display:flex;gap:8px">
      <button class="btn bghost" onclick="clearAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>Hapus Semua
      </button>
      <button class="btn boutline" id="bdla" onclick="dlAll()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download Semua
      </button>
      <button class="btn bprimary" id="bpr" onclick="run()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>Proses Semua
      </button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer>Semua proses dilakukan di browser Anda. Foto tidak dikirim ke server manapun.</footer>
<div class="notif" id="notif"></div>

<script>
const S={files:[],results:{},busy:false};
const $=id=>document.getElementById(id);
const dz=$('dz'),fi=$('fi');

dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');add([...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')));});
fi.addEventListener('change',e=>{add([...e.target.files]);fi.value='';});

function add(files){
  files.forEach(file=>{
    const id=Math.random().toString(36).slice(2)+Date.now().toString(36);
    S.files.push({id,file});
    mkCard(id,file);
  });
  ui();
}

function mkCard(id,file){
  const url=URL.createObjectURL(file);
  const el=document.createElement('div');
  el.className='card';el.id='card-'+id;
  el.innerHTML=`
    <button class="bx" onclick="rm('${id}')">×</button>
    <img class="cimg" id="img-${id}" src="${url}">
    <div class="cbody">
      <div class="cname" title="${file.name}">${file.name}</div>
      <div class="cst">
        <span class="sb sw" id="st-${id}"><span class="dot"></span>Menunggu</span>
        <button class="bdl" id="dl-${id}" disabled onclick="dlOne('${id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
    </div>`;
  $('grid').appendChild(el);
}

function rm(id){S.files=S.files.filter(f=>f.id!==id);delete S.results[id];$('card-'+id)?.remove();ui();}
function clearAll(){S.files=[];S.results={};$('grid').innerHTML='';ui();}

function ui(){
  const n=S.files.length;
  $('tb').style.display=n?'flex':'none';
  $('cl').innerHTML=`${n} foto <span>ditambahkan</span>`;
  $('bdla').disabled=!Object.values(S.results).some(Boolean);
  $('bpr').disabled=S.busy||!n;
}

function setSt(id,s){
  const el=$('st-'+id);if(!el)return;
  const L={waiting:'Menunggu',processing:'Memproses...',done:'Selesai',error:'Gagal'};
  const cls={waiting:'sw',processing:'sp',done:'sd',error:'se'};
  el.className=`sb ${cls[s]}`;
  el.innerHTML=`<span class="dot"></span>${L[s]}`;
}

// ── LOAD LIBRARY via script tag (most reliable method) ────────────────────────
let bgLib = null;

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>res();
    s.onerror=()=>rej(new Error('Failed: '+src));
    document.head.appendChild(s);
  });
}

async function getLib(){
  if(bgLib) return bgLib;
  
  showBanner('Memuat library AI... harap tunggu','bwarn');
  
  // Try multiple CDN sources
  const cdns = [
    'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/browser/index.js',
    'https://unpkg.com/@imgly/background-removal@1.4.5/dist/browser/index.js',
  ];
  
  let loaded = false;
  for(const cdn of cdns){
    try{
      await loadScript(cdn);
      // Check if global is available
      if(typeof imglyRemoveBackground !== 'undefined'){
        loaded = true;
        break;
      }
    }catch(e){
      console.warn('CDN failed:', cdn, e);
    }
  }
  
  if(!loaded || typeof imglyRemoveBackground === 'undefined'){
    throw new Error('Library tidak dapat dimuat dari semua CDN');
  }
  
  bgLib = imglyRemoveBackground;
  hideBanner();
  return bgLib;
}

async function run(){
  if(S.busy)return;
  S.busy=true;$('bpr').disabled=true;
  $('pw').classList.add('on');

  let lib;
  try{
    lib = await getLib();
  }catch(e){
    showBanner('Gagal memuat library AI: '+e.message,'berr');
    S.busy=false;ui();return;
  }

  const queue=S.files.filter(f=>!S.results[f.id]);
  let done=0;

  for(const item of queue){
    $('plbl').textContent=`Memproses: ${item.file.name}`;
    $('pct').textContent=`${done}/${queue.length}`;
    $('pfill').style.width=`${(done/queue.length)*100}%`;
    setSt(item.id,'processing');

    try{
      const blob = await lib.removeBackground(item.file,{
        publicPath:'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/browser/',
        output:{format:'image/png',quality:1},
        progress:(key,cur,tot)=>{
          if(tot>0){
            const pct=Math.round(cur/tot*100);
            if(key.startsWith('fetch:')) $('plbl').textContent=`Mengunduh model AI... ${pct}%`;
            else if(key==='compute:inference') $('plbl').textContent=`Memproses ${item.file.name}... ${pct}%`;
          }
        }
      });
      S.results[item.id]=blob;
      $('img-'+item.id).src=URL.createObjectURL(blob);
      setSt(item.id,'done');
      $('dl-'+item.id).disabled=false;
    }catch(e){
      console.error('Process error:',item.file.name,e);
      setSt(item.id,'error');
    }
    done++;
  }

  $('pfill').style.width='100%';
  $('plbl').textContent=`Selesai! ${done} foto diproses.`;
  $('pct').textContent=`${done}/${queue.length}`;
  S.busy=false;ui();
  toast(`${done} foto selesai`);
}

function dlOne(id){
  const blob=S.results[id];if(!blob)return;
  const f=S.files.find(x=>x.id===id);
  dl(blob,(f?.file.name||'img').replace(/\.[^.]+$/,'')+'_no_bg.png');
}

async function dlAll(){
  const done=S.files.filter(f=>S.results[f.id]);
  if(!done.length)return;
  if(done.length===1){dlOne(done[0].id);return;}
  toast('Membuat ZIP...');
  const zip=new JSZip();
  done.forEach(f=>zip.file(f.file.name.replace(/\.[^.]+$/,'')+'_no_bg.png',S.results[f.id]));
  dl(await zip.generateAsync({type:'blob'}),'bg_removed.zip');
  toast('ZIP diunduh!');
}

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
function showBanner(msg,cls){$('btxt').textContent=msg;const b=$('banner');b.className=`banner on ${cls}`;}
function hideBanner(){$('banner').classList.remove('on');}
function toast(msg){const n=$('notif');n.textContent=msg;n.classList.add('on');setTimeout(()=>n.classList.remove('on'),2800);}
</script>
</body>
</html>
