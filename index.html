<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>BG Remover - Hapus Background dengan AI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F6F3; --surface: #FFFFFF; --border: #E8E6E0;
      --text: #1A1917; --muted: #8C8A85; --accent: #1A1917;
      --green: #2D6A4F; --green-light: #D8F3DC;
      --amber: #B45309; --amber-light: #FEF3C7;
      --red: #DC2626; --red-light: #FEE2E2;
      --blue: #2563EB; --blue-light: #DBEAFE;
      --radius: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 28px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; gap: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; letter-spacing: -0.3px; }
    .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: grid; place-items: center; }
    .logo-icon svg { width: 18px; height: 18px; }
    .badge { font-family: 'DM Mono', monospace; font-size: 11px; background: var(--bg); border: 1px solid var(--border); padding: 3px 8px; border-radius: 20px; color: var(--muted); }
    main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 48px 24px; }
    .drop-zone { border: 2px dashed var(--border); border-radius: 20px; padding: 64px 40px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--surface); position: relative; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: #FAFAF8; }
    .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .drop-icon { width: 56px; height: 56px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; display: grid; place-items: center; margin: 0 auto 20px; }
    .drop-icon svg { width: 26px; height: 26px; color: var(--muted); }
    .drop-title { font-size: 18px; font-weight: 500; letter-spacing: -0.3px; margin-bottom: 8px; }
    .drop-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }
    .drop-sub span { display: inline-block; margin-top: 6px; font-family: 'DM Mono', monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin: 32px 0 16px; padding: 0 2px; flex-wrap: wrap; gap: 12px; }
    .count-label { font-size: 14px; font-weight: 500; }
    .count-label span { color: var(--muted); font-weight: 400; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
    .btn svg { width: 15px; height: 15px; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #333; }
    .btn-primary:disabled { background: #CCC; cursor: not-allowed; }
    .btn-outline { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--bg); }
    .btn-outline:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); padding: 8px 10px; }
    .btn-ghost:hover { color: var(--text); background: var(--bg); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: box-shadow 0.2s; position: relative; }
    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .card-img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: repeating-conic-gradient(#F0EEE9 0% 25%, #E8E6E0 0% 50%) 0 0 / 16px 16px; }
    .card-body { padding: 10px 12px; border-top: 1px solid var(--border); }
    .card-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
    .card-status { display: flex; align-items: center; justify-content: space-between; }
    .status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; }
    .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-waiting { background: var(--bg); color: var(--muted); }
    .status-waiting .dot { background: var(--muted); }
    .status-processing { background: var(--amber-light); color: var(--amber); }
    .status-processing .dot { background: var(--amber); animation: pulse 1s infinite; }
    .status-done { background: var(--green-light); color: var(--green); }
    .status-done .dot { background: var(--green); }
    .status-error { background: var(--red-light); color: var(--red); }
    .status-error .dot { background: var(--red); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .btn-download { background: none; border: none; padding: 4px; cursor: pointer; color: var(--muted); border-radius: 6px; display: grid; place-items: center; transition: all 0.15s; }
    .btn-download:hover { color: var(--text); background: var(--bg); }
    .btn-download svg { width: 15px; height: 15px; }
    .btn-download:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-remove { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.95); border: 1px solid var(--border); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; display: none; place-items: center; color: var(--muted); font-size: 18px; line-height: 1; transition: all 0.15s; z-index: 10; }
    .card:hover .btn-remove { display: grid; }
    .btn-remove:hover { color: #B91C1C; border-color: #FCA5A5; background: #FEF2F2; }
    .progress-wrap { margin: 24px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; display: none; }
    .progress-wrap.visible { display: block; }
    .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .progress-label { font-size: 13px; font-weight: 500; word-break: break-word; }
    .progress-count { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
    .progress-bar-track { height: 4px; background: var(--bg); border-radius: 99px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; width: 0%; }
    .init-banner { background: var(--blue-light); border: 1px solid #93C5FD; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--blue); margin-bottom: 20px; display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
    .init-banner.visible { display: flex; }
    .init-banner.error { background: var(--red-light); border-color: #FCA5A5; color: var(--red); }
    .loading-spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; padding: 24px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
    .notif { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: white; padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.15); transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 100; max-width: 90%; }
    .notif.show { transform: translateY(0); opacity: 1; }
    @media (max-width: 640px) { main { padding: 24px 16px; } header { padding: 20px 16px; } .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; } .toolbar { flex-direction: column; align-items: stretch; } .btn { justify-content: center; } }
  </style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
      </svg>
    </div>
    BG Remover
  </div>
  <div class="badge">100% Lokal · Tanpa Upload</div>
</header>

<main>
  <div class="init-banner" id="initBanner">
    <div class="loading-spinner"></div>
    <span id="initText">Memuat model AI, harap tunggu...</span>
  </div>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple />
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>
    <div class="drop-title">Drag & drop foto di sini</div>
    <div class="drop-sub">atau klik untuk memilih file<br><span>JPG · PNG · WEBP (Max 10MB per file)</span></div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-top">
      <span class="progress-label" id="progressLabel">Memproses...</span>
      <span class="progress-count" id="progressCount">0 / 0</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none">
    <div><span class="count-label" id="countLabel">0 foto <span>ditambahkan</span></span></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-ghost" id="clearAllBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        Hapus Semua
      </button>
      <button class="btn btn-outline" id="btnDownloadAll" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Semua
      </button>
      <button class="btn btn-primary" id="btnProcess">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Proses Semua
      </button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>⚠️ Pemrosesan menggunakan AI di browser Anda. Gambar tidak dikirim ke server manapun.</footer>
<div class="notif" id="notif"></div>

<script>
  // ==================== STATE MANAGEMENT ====================
  const state = { 
    files: [], 
    results: {}, 
    processing: false, 
    cancelProcessing: false
  };
  
  // ==================== DOM ELEMENTS ====================
  const $ = id => document.getElementById(id);
  const dropZone = $('dropZone');
  const fileInput = $('fileInput');
  const grid = $('grid');
  const toolbar = $('toolbar');
  const btnProcess = $('btnProcess');
  const btnDownloadAll = $('btnDownloadAll');
  const clearAllBtn = $('clearAllBtn');
  const progressWrap = $('progressWrap');
  const progressFill = $('progressFill');
  const progressCount = $('progressCount');
  const progressLabel = $('progressLabel');
  const countLabel = $('countLabel');
  const initBanner = $('initBanner');
  const initText = $('initText');
  const notif = $('notif');

  // ==================== HELPER FUNCTIONS ====================
  function showNotif(msg, isError = false) {
    notif.textContent = msg;
    notif.classList.add('show');
    notif.style.background = isError ? '#DC2626' : 'var(--accent)';
    setTimeout(() => {
      notif.classList.remove('show');
    }, 3000);
  }

  function validateFile(file) {
    const maxSize = 10 * 1024 * 1024;
    const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
    
    if (!validTypes.includes(file.type)) {
      showNotif(`❌ ${file.name}: Format tidak didukung (hanya JPG, PNG, WEBP)`, true);
      return false;
    }
    if (file.size > maxSize) {
      showNotif(`❌ ${file.name}: Ukuran terlalu besar (maks 10MB)`, true);
      return false;
    }
    return true;
  }

  function cleanupObjectURLs() {
    document.querySelectorAll('.card-img').forEach(img => {
      if (img.src && img.src.startsWith('blob:')) {
        URL.revokeObjectURL(img.src);
      }
    });
  }

  // ==================== CARD RENDERING ====================
  function renderCard(id, file) {
    const url = URL.createObjectURL(file);
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + id;
    card.innerHTML = `
      <button class="btn-remove" data-id="${id}">×</button>
      <img class="card-img" id="img-${id}" src="${url}" alt="${file.name}" loading="lazy" />
      <div class="card-body">
        <div class="card-name" title="${file.name}">${file.name.length > 30 ? file.name.substring(0, 27) + '...' : file.name}</div>
        <div class="card-status">
          <span class="status-badge status-waiting" id="status-${id}"><span class="dot"></span> Menunggu</span>
          <button class="btn-download" id="dl-${id}" disabled data-id="${id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
        </div>
      </div>`;
    
    grid.appendChild(card);
    
    card.querySelector('.btn-remove').addEventListener('click', (e) => {
      e.stopPropagation();
      removeCard(id);
    });
    
    card.querySelector(`#dl-${id}`).addEventListener('click', () => downloadOne(id));
  }

  function removeCard(id) {
    const img = $(`img-${id}`);
    if (img && img.src.startsWith('blob:')) {
      URL.revokeObjectURL(img.src);
    }
    
    state.files = state.files.filter(f => f.id !== id);
    delete state.results[id];
    const el = $('card-' + id);
    if (el) el.remove();
    updateUI();
    showNotif(`🗑️ Gambar dihapus`);
  }

  function clearAll() {
    if (state.files.length === 0) return;
    if (confirm(`Hapus semua ${state.files.length} gambar?`)) {
      cleanupObjectURLs();
      state.files = [];
      state.results = {};
      grid.innerHTML = '';
      updateUI();
      showNotif(`Semua gambar telah dihapus`);
    }
  }

  // ==================== UI UPDATE ====================
  function updateUI() {
    const n = state.files.length;
    toolbar.style.display = n > 0 ? 'flex' : 'none';
    countLabel.innerHTML = `${n} foto <span>ditambahkan</span>`;
    const hasResults = Object.keys(state.results).length > 0;
    btnDownloadAll.disabled = !hasResults || state.processing;
    btnProcess.disabled = state.processing || n === 0;
  }

  function setStatus(id, status, errorMsg = '') {
    const el = $('status-' + id);
    if (!el) return;
    const labels = { waiting: 'Menunggu', processing: 'Memproses...', done: 'Selesai', error: errorMsg || 'Gagal' };
    el.className = `status-badge status-${status}`;
    el.innerHTML = `<span class="dot"></span> ${labels[status]}`;
    if (status === 'error') el.title = errorMsg;
  }

  // ==================== REMOVE BACKGROUND USING CANVAS + TRANSFORM ====================
  // Menggunakan pendekatan alternatif: segmentasi dengan konversi ke chroma key sederhana
  // Ini lebih ringan dan tidak memerlukan download model AI
  
  async function removeBackgroundSimple(imageFile) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(imageFile);
      
      img.onload = () => {
        URL.revokeObjectURL(url);
        
        // Create canvas with original dimensions
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        
        // Draw original image
        ctx.drawImage(img, 0, 0);
        
        // Get image data
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        
        // Simple background removal based on edge detection and color analysis
        // This is a basic implementation - for better results, we'd use a proper ML model
        // But since the original library had CDN issues, this provides a working alternative
        
        // Create a mask based on edge detection
        const width = canvas.width;
        const height = canvas.height;
        
        // Create a separate canvas for the mask
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = width;
        maskCanvas.height = height;
        const maskCtx = maskCanvas.getContext('2d');
        
        // Draw image on mask canvas
        maskCtx.drawImage(img, 0, 0);
        const maskData = maskCtx.getImageData(0, 0, width, height);
        const maskPixels = maskData.data;
        
        // Simple heuristic: assume background is at the edges
        // Sample background color from the four corners
        const samples = [
          { x: 0, y: 0 },
          { x: width - 1, y: 0 },
          { x: 0, y: height - 1 },
          { x: width - 1, y: height - 1 }
        ];
        
        let bgR = 0, bgG = 0, bgB = 0;
        samples.forEach(sample => {
          const idx = (sample.y * width + sample.x) * 4;
          bgR += maskPixels[idx];
          bgG += maskPixels[idx + 1];
          bgB += maskPixels[idx + 2];
        });
        bgR /= 4;
        bgG /= 4;
        bgB /= 4;
        
        // Threshold for background detection
        const threshold = 50;
        
        // Apply transparency based on similarity to background color
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          
          // Calculate color difference
          const diff = Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB);
          
          // If color is similar to background, make transparent
          if (diff < threshold) {
            data[i + 3] = 0; // Set alpha to 0
          }
        }
        
        // Put the modified image data back
        ctx.putImageData(imageData, 0, 0);
        
        // Convert canvas to blob
        canvas.toBlob(blob => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error('Gagal memproses gambar'));
          }
        }, 'image/png');
      };
      
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('Gagal memuat gambar'));
      };
      
      img.src = url;
    });
  }
  
  // Alternative: Use a Web Worker with a more sophisticated approach
  // But for simplicity and to avoid CDN issues, we'll use a canvas-based approach
  // that works offline and doesn't require external dependencies
  
  // For better results, we'll also provide an option to use a CDN-based solution
  // with correct configuration if the user has internet
  
  let useSimpleMethod = true;
  
  async function loadAdvancedModel() {
    // Try to load the advanced model, but fallback to simple method if it fails
    try {
      initText.textContent = 'Mencoba memuat model AI canggih...';
      
      // Try multiple CDN configurations
      const configs = [
        {
          url: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/background-removal.esm.js',
          publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/'
        },
        {
          url: 'https://unpkg.com/@imgly/background-removal@1.4.5/dist/background-removal.esm.js',
          publicPath: 'https://unpkg.com/@imgly/background-removal@1.4.5/dist/'
        }
      ];
      
      for (const config of configs) {
        try {
          const module = await import(config.url);
          if (module.removeBackground) {
            return {
              removeBg: module.removeBackground,
              config: { publicPath: config.publicPath }
            };
          }
        } catch (e) {
          console.warn(`Failed with ${config.url}:`, e);
        }
      }
      
      throw new Error('All CDNs failed');
    } catch (e) {
      console.warn('Advanced model unavailable, using simple method:', e);
      return null;
    }
  }
  
  let advancedRemover = null;
  
  async function processImage(imageFile) {
    if (advancedRemover) {
      try {
        return await advancedRemover.removeBg(imageFile, {
          publicPath: advancedRemover.config.publicPath,
          output: { format: 'image/png' }
        });
      } catch (e) {
        console.warn('Advanced method failed, falling back to simple:', e);
        return await removeBackgroundSimple(imageFile);
      }
    } else {
      return await removeBackgroundSimple(imageFile);
    }
  }
  
  // Try to load advanced model in background
  setTimeout(async () => {
    try {
      const advanced = await loadAdvancedModel();
      if (advanced) {
        advancedRemover = advanced;
        initBanner.classList.remove('visible');
        showNotif('✅ Model AI canggih siap digunakan!');
      } else {
        initBanner.classList.remove('visible');
        showNotif('ℹ️ Menggunakan metode sederhana (tanpa download)');
      }
    } catch (e) {
      initBanner.classList.remove('visible');
      showNotif('ℹ️ Menggunakan metode pemrosesan lokal', false);
    }
  }, 1000);

  // ==================== PROCESSING ====================
  async function startProcessing() {
    if (state.processing) {
      showNotif('⚠️ Proses sedang berjalan', true);
      return;
    }
    
    if (state.files.length === 0) {
      showNotif('⚠️ Tidak ada gambar untuk diproses', true);
      return;
    }
    
    state.processing = true;
    state.cancelProcessing = false;
    btnProcess.disabled = true;
    btnProcess.textContent = '⏳ Memproses...';
    progressWrap.classList.add('visible');
    
    const toProcess = state.files.filter(f => !state.results[f.id]);
    let processed = 0;
    let successful = 0;
    
    for (let i = 0; i < toProcess.length; i++) {
      if (state.cancelProcessing) {
        showNotif('⏹️ Proses dibatalkan');
        break;
      }
      
      const item = toProcess[i];
      progressLabel.textContent = `Memproses: ${item.file.name.substring(0, 50)}`;
      progressCount.textContent = `${processed} / ${toProcess.length}`;
      progressFill.style.width = `${(processed / toProcess.length) * 100}%`;
      setStatus(item.id, 'processing');
      
      try {
        const resultBlob = await processImage(item.file);
        
        state.results[item.id] = resultBlob;
        
        const imgElement = $(`img-${item.id}`);
        const oldUrl = imgElement.src;
        imgElement.src = URL.createObjectURL(resultBlob);
        if (oldUrl.startsWith('blob:')) {
          URL.revokeObjectURL(oldUrl);
        }
        
        setStatus(item.id, 'done');
        const downloadBtn = $(`dl-${item.id}`);
        if (downloadBtn) downloadBtn.disabled = false;
        
        successful++;
        showNotif(`✅ ${item.file.name.substring(0, 30)} selesai`);
        
      } catch (err) {
        console.error(`Error processing ${item.file.name}:`, err);
        setStatus(item.id, 'error', err.message || 'Gagal diproses');
        showNotif(`❌ ${item.file.name.substring(0, 30)}: Gagal`, true);
      }
      
      processed++;
    }
    
    progressFill.style.width = '100%';
    progressLabel.textContent = `Selesai! ${successful} dari ${toProcess.length} gambar berhasil diproses.`;
    progressCount.textContent = `${processed} / ${toProcess.length}`;
    
    state.processing = false;
    btnProcess.textContent = '▶️ Proses Semua';
    updateUI();
    
    if (successful > 0) {
      showNotif(`✨ ${successful} gambar berhasil diproses!`);
    }
  }

  // ==================== DOWNLOAD FUNCTIONS ====================
  function downloadBlob(blob, filename) {
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 100);
  }

  function downloadOne(id) {
    const blob = state.results[id];
    if (!blob) {
      showNotif('❌ Hasil tidak ditemukan', true);
      return;
    }
    const item = state.files.find(f => f.id === id);
    const baseName = (item?.file.name || 'image').replace(/\.[^.]+$/, '');
    const filename = `${baseName}_no_bg.png`;
    downloadBlob(blob, filename);
    showNotif(`📥 ${baseName} diunduh`);
  }

  async function downloadAll() {
    const doneItems = state.files.filter(f => state.results[f.id]);
    if (doneItems.length === 0) {
      showNotif('⚠️ Tidak ada hasil untuk diunduh', true);
      return;
    }
    
    if (doneItems.length === 1) {
      downloadOne(doneItems[0].id);
      return;
    }
    
    showNotif('📦 Membuat file ZIP...');
    
    try {
      const JSZip = window.JSZip;
      if (!JSZip) {
        showNotif('❌ Library ZIP tidak tersedia', true);
        return;
      }
      
      const zip = new JSZip();
      
      for (const item of doneItems) {
        const blob = state.results[item.id];
        const baseName = item.file.name.replace(/\.[^.]+$/, '');
        zip.file(`${baseName}_no_bg.png`, blob);
      }
      
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      downloadBlob(zipBlob, 'bg_removed_images.zip');
      showNotif(`📦 ZIP berhasil diunduh (${doneItems.length} file)`);
    } catch (err) {
      console.error('ZIP creation failed:', err);
      showNotif('❌ Gagal membuat file ZIP', true);
    }
  }

  // ==================== FILE HANDLING ====================
  function handleFiles(files) {
    const validFiles = files.filter(validateFile);
    
    if (validFiles.length === 0) {
      if (files.length > 0) showNotif('⚠️ Tidak ada file valid yang dipilih', true);
      return;
    }
    
    validFiles.forEach(file => {
      const id = Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
      state.files.push({ id, file });
      renderCard(id, file);
    });
    
    updateUI();
    showNotif(`📸 ${validFiles.length} gambar ditambahkan`);
    if (fileInput) fileInput.value = '';
  }

  // ==================== EVENT LISTENERS ====================
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  
  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('drag-over');
  });
  
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    handleFiles(Array.from(e.dataTransfer.files));
  });
  
  dropZone.addEventListener('click', (e) => {
    if (e.target === dropZone || e.target.closest('.drop-icon, .drop-title, .drop-sub')) {
      fileInput.click();
    }
  });
  
  fileInput.addEventListener('change', (e) => {
    handleFiles(Array.from(e.target.files));
  });
  
  btnProcess.addEventListener('click', startProcessing);
  btnDownloadAll.addEventListener('click', downloadAll);
  clearAllBtn.addEventListener('click', clearAll);
  
  window.addEventListener('beforeunload', () => {
    cleanupObjectURLs();
  });
  
  // Hide init banner after 3 seconds if still loading
  setTimeout(() => {
    if (initBanner.classList.contains('visible')) {
      initBanner.classList.remove('visible');
      showNotif('ℹ️ Menggunakan metode pemrosesan lokal sederhana', false);
    }
  }, 5000);
</script>
</body>
</html>
